# Used only when the "mysql" profile is active.
# The database "smartpool" is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/smartpool?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=CHANGE_THIS_PASSWORD
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
