# Default database: H2 stored in a file (./data/smartpool.mv.db). Nothing to install.
spring.datasource.url=jdbc:h2:file:./data/smartpool
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates and updates the tables from the entity classes. No SQL needed.
spring.jpa.hibernate.ddl-auto=update

# Web console to look at the tables: http://localhost:8080/h2-console
spring.h2.console.enabled=true
